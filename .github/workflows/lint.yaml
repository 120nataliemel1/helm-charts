name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [kong, cert-manager, rancher]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Build dependencies
        run: helm dependency build charts/${{ matrix.chart }}
      - name: Lint
        run: helm lint charts/${{ matrix.chart }}
      - name: Render
        run: helm template ${{ matrix.chart }} charts/${{ matrix.chart }} --kube-version 1.35.0 --api-versions networking.k8s.io/v1/IngressClass > /dev/null
