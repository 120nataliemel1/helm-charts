# The only manifest applied by hand. It points Argo CD at bootstrap/, which
# creates the Applications for every chart. Set `cluster` to this folder's name.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/120nataliemel1/helm-charts.git
    targetRevision: main
    path: bootstrap
    helm:
      valuesObject:
        cluster: example
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
